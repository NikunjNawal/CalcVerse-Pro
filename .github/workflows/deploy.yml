# CalcVerse Pro — GitHub Pages deployment (prepared in the A3/V2 deployment
# investigation; NOT yet committed or pushed).
#
# Root cause addressed: GitHub Pages currently publishes the repo ROOT of main
# (the pre-A1 static site). The Vite app requires a BUILD; its artifacts live
# in dist/ and must be published instead. This workflow builds on every push
# to main and publishes dist/ via the official GitHub Actions Pages flow.
#
# REQUIRED ONE-TIME REPO SETTING (cannot be done from source):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (prebuild generates calculator pages + sitemap)
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
